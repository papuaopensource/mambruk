name = "mambruk"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# D1 Database binding
# Reuses the database created for the standalone shortener; schema.sql is
# additive (CREATE TABLE IF NOT EXISTS), so applying it here is safe.
[[d1_databases]]
binding = "DB"
database_name = "mambruk-db"
database_id = "ee268ac4-913f-48f5-908d-d46ccef51e2c"

# KV binding for rate limiting.
# TODO: create with `wrangler kv namespace create RATE_LIMITER` (and --preview)
# and paste the ids. Until then rate limiting is a no-op, by design in
# RateLimiter.checkLimit.
[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "your-kv-namespace-id"
preview_id = "your-kv-preview-id"

[env.production.vars]
NODE_ENV = "production"

[env.preview.vars]
NODE_ENV = "preview"
